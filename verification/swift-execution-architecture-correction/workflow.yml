name: Swift execution architecture correction
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swift-execution-architecture-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /verification/swift-cache-capacity-campaign-v1/
            /verification/swift-execution-architecture-correction/
            /verification/swift-execution-architecture-comparison/seal.json
            /verification/swift-execution-architecture-independent/seal.json
            /verification/github-delivery-binary-export-and-ui/cache-deadline-review/seal.json
            /verification/github-delivery-binary-export-and-ui/cache-deadline-review/receipt.json
            /verification/github-delivery-binary-export-and-ui/cache-deadline-review/REVIEW.md
      - name: Pure source and decision controls
        timeout-minutes: 1
        run: python3 -B verification/swift-execution-architecture-correction/test_campaign.py
      - name: Install the same pinned compiler
        timeout-minutes: 2
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Prepare both finite geometry arms then run exactly two full attempts
        timeout-minutes: 46
        run: >-
          python3 -B verification/swift-execution-architecture-correction/campaign.py run
          --output "$RUNNER_TEMP/swift-execution-architecture-correction"
      - name: Preserve failures, original observations and separate prefix diagnostics
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-execution-architecture-correction-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swift-execution-architecture-correction/
            !${{ runner.temp }}/swift-execution-architecture-correction/scratch/
          if-no-files-found: error
          retention-days: 30
