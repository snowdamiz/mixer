name: Worker controller checks
on:
  push:
    paths:
      - 'hosted-worker-controller/**'
      - 'verification/hosted-worker-controller-contract/**'
      - 'verification/hosted-worker-controller-v2/focused.mjs'
      - 'verification/hosted-worker-controller-v2/inputs/verification/hosted-worker-controller-implementation-independent-review/regressions.mjs'
      - 'verification/hosted-worker-controller-implementation/jason-control-vectors.json'
      - 'verification/hosted-worker-transport/cross-runtime-vectors.json'
      - '.github/workflows/worker-controller.yml'
  pull_request:
    paths:
      - 'hosted-worker-controller/**'
      - 'verification/hosted-worker-controller-contract/**'
      - 'verification/hosted-worker-controller-v2/focused.mjs'
      - 'verification/hosted-worker-controller-v2/inputs/verification/hosted-worker-controller-implementation-independent-review/regressions.mjs'
      - 'verification/hosted-worker-controller-implementation/jason-control-vectors.json'
      - 'verification/hosted-worker-transport/cross-runtime-vectors.json'
      - '.github/workflows/worker-controller.yml'
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install exact development dependencies without package scripts
        working-directory: hosted-worker-controller
        run: |
          node --version
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Controller persistence, authority and time regressions
        working-directory: hosted-worker-controller
        env:
          MIXER_CONTROLLER_CHECK_DIR: ${{ runner.temp }}/worker-controller
        run: npm test
      - name: Preserve controller host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-controller-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/worker-controller/
