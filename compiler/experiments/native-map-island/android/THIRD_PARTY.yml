schema: 1
policy: independently-owned-product-engine
dependencies:
  - name: Swift Crypto and transitive Swift ASN.1
    versions: ["5.0.3", "1.7.3"]
    license: Apache-2.0
    origin: https://github.com/apple/swift-crypto
    inventory: Package.resolved
    purpose: Signature verification through MixerUpdates
  - name: Swift toolchain and Android SDK for Swift
    version: "6.3.3"
    origin: https://www.swift.org/
    license: Apache-2.0 WITH Swift-exception
    purpose: Cross-compiler and fixture native runtime
  - name: Android NDK
    version: r27d
    origin: https://developer.android.com/ndk
    license: Android SDK License Agreement
    purpose: JNI toolchain and Android libc++ for the local fixture
  - name: Android SDK Platform and Build Tools
    versions: ["37.1", "37.0.0"]
    origin: https://developer.android.com/tools
    license: Android SDK License Agreement
    purpose: Compile stubs and DEX check
  - name: OpenJDK
    version: "25"
    origin: https://openjdk.org/
    license: GPL-2.0-only WITH Classpath-exception-2.0
    purpose: External host regression and compiler runtime
  - name: Kotlin toolchain and standard library
    version: "2.3.0"
    origin: https://github.com/JetBrains/kotlin
    license: Apache-2.0
    purpose: Host and fixture compiler, Compose compiler plugin, and classpath
  - name: Kotlin compiler runtime dependencies
    coordinates: [org.jetbrains.kotlin:kotlin-reflect, org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm, org.jetbrains:annotations]
    versions: ["1.6.10", "1.8.0", "13.0"]
    license: Apache-2.0
    origin: https://repo.maven.apache.org/maven2/
    purpose: External compiler classpath
  - name: AndroidX Compose Foundation, Runtime, and UI
    version: "1.11.2"
    origin: https://android.googlesource.com/platform/frameworks/support/
    license: Apache-2.0
    purpose: Compile and run the private Compose fixture in an Android host
