permissions:
  contents: read

concurrency:
  group: identity-network-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the finite qualification inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /hosted/**
            /console/tests/cookie-build-client.test.mjs
            /console/src/api/cookie-build-client.ts
            /console/src/domain/build-read.ts
            /console/tsconfig.json
            /console/src/domain/workspace-directory.ts
            /console/src/domain/build-overview.ts
            /console/src/api/workspace-transport.ts
            /console/src/api/workspace-client.ts
            /console/src/api/cookie-workspace-client.ts
            /console/src/api/browser-session-client.ts
            /console/package.json
            /console/src/state/browser-session-controller.ts
            /console/src/state/workspace-controller.ts
            /console/src/api/cookie-build-catalog-client.ts
            /console/src/domain/build-catalog.ts
            /console/src/App.tsx
            /console/src/main.tsx
            /console/src/styles.css
            /console/src/api/browser-login-client.ts
            /console/src/state/sign-in-action.ts
            /console/src/components/SignIn.tsx
            /console/tests/browser-login.test.mjs
            /.github/workflows/hosted.yml
            /AGENTS.md
            /THIRD_PARTY.yml
            /docs/hosted-browser-auth-protocol.md
            /docs/hosted-browser-session-storage.md
            /services/protocol/testdata/signed-release-v3.json
            /services/protocol/testdata/release-v3-cases.json
            /console/package-lock.json
            /verification/hosted-browser-auth-protocol/run.py
            /verification/hosted-customer-workspace-http-integration/node-client-driver.mjs
            /verification/hosted-customer-artifact-event/golden_event.hex
            /verification/hosted-customer-artifact-event/golden_hashes.txt
            /.github/workflows/identity-network.yml
            /.github/workflows/verify.yml
            /docs/hosted-identity-production-network-ci-contract.md
            /verification/identity-production-network-contract/**
            /verification/identity-network-image-amendment-v1/metadata/**
            /verification/identity-network-image-amendment-v2/metadata/**
            /verification/identity-network-fixture-amendment-v1/metadata/**
            /verification/identity-network-fixture-amendment-v2/metadata/**
            /verification/identity-network-current-source-v1/**
            /verification/identity-network-current-source-v2/**
            /verification/identity-network-current-source-v3/**
            /verification/identity-network-current-source-v4/**
            /verification/identity-network-current-source-v5/**
            /verification/identity-network-current-source-v6/**
            /verification/identity-network-current-source-v7/**
            /verification/identity-network-current-source-v8/**
            /verification/identity-network-current-source-v9/**
            /verification/identity-network-current-source-v10/**
            /verification/identity-network-current-source-v11/selection.json
            /verification/identity-network-current-source-v11/selected-source-manifest.json
            /verification/identity-network-current-source-v12/selection.json
            /verification/identity-network-current-source-v12/selected-source-manifest.json
            /verification/identity-network-current-source-v13/selection.json
            /verification/identity-network-current-source-v13/selected-source-manifest.json
            /verification/identity-network-current-source-v14/selection.json
            /verification/identity-network-current-source-v14/selected-source-manifest.json
            /verification/identity-network-current-source-v15/selection.json
            /verification/identity-network-current-source-v16/selection.json
            /verification/identity-network-current-source-v17/selection.json
            /verification/identity-network-current-source-v18/selection.json
            /verification/identity-network-current-source-v15/selected-source-manifest.json
            /verification/identity-network-current-source-v16/selected-source-manifest.json
            /verification/identity-network-current-source-v17/selected-source-manifest.json
            /verification/identity-network-current-source-v18/selected-source-manifest.json
            /verification/identity-network-current-source-v19/selection.json
            /verification/identity-network-current-source-v19/selected-source-manifest.json
            /console/src/components/ApplicationBuildPage.tsx
            /console/src/state/build-selection-controller.ts
            /console/tests/application-build-page.test.mjs
            /console/tests/build-selection-controller.test.mjs
            /verification/identity-network-current-source-v20/selection.json
            /verification/identity-network-current-source-v20/selected-source-manifest.json
            /verification/identity-network-current-source-v21/selection.json
            /verification/identity-network-current-source-v21/selected-source-manifest.json
            /verification/identity-network-current-source-v22/selection.json
            /verification/identity-network-current-source-v22/selected-source-manifest.json
            /verification/identity-network-current-source-v23/selection.json
            /verification/identity-network-current-source-v23/selected-source-manifest.json
            /verification/identity-network-current-source-v24/selection.json
            /verification/identity-network-current-source-v24/selected-source-manifest.json
            /console/src/api/build-submission.ts
            /console/src/brand.css
            /console/src/build-submission-test-runtime.tsx
            /console/src/build-submission.test.mjs
            /console/src/components/BuildCreation.tsx
            /console/src/components/BuildOverview.tsx
            /console/src/components/ReleaseChecks.tsx
            /console/src/components/WorkspaceDirectory.tsx
            /console/src/components/WorkspacePage.tsx
            /console/src/components/application-build-page.css
            /console/src/components/build-overview.css
            /console/src/components/workspace-directory.css
            /console/src/domain/build-submission.ts
            /console/src/domain/release-check-summary.ts
            /console/src/preview/BuildOverviewPreview.tsx
            /console/src/preview/ReleaseChecksPreview.tsx
            /console/src/reselection-regression.test.mjs
            /console/src/state/browser-session-binding.ts
            /console/src/state/build-selection-binding.ts
            /console/src/state/workspace-binding.ts
            /console/src/state/workspace-context.tsx
            /console/tests/application-build-page-runtime.tsx
            /console/tests/helpers/build-selection-compiled.mjs
            /console/vite.config.ts
      - name: Admit the explicitly selected current hosted source
        run: python3 -B hosted/scripts/test-identity-network.py --check-source
      - name: Check collector fault decisions without Docker
        run: python3 -B hosted/scripts/test_identity_network_collector.py
      - name: Run the two production-path network methods
        run: python3 -B hosted/scripts/test-identity-network.py --sha "$GITHUB_SHA" --output "$GITHUB_WORKSPACE/identity-network-evidence"
      - name: Finalize exact owned resources and retain failures
        if: always()
        run: python3 -B hosted/scripts/test-identity-network.py --finalize "$GITHUB_WORKSPACE/identity-network-evidence"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: identity-production-network-${{ github.sha }}-${{ github.run_attempt }}
          path: identity-network-evidence/**
          if-no-files-found: error
          retention-days: 14
