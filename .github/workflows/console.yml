name: Console domain checks
on:
  push:
    paths: ['console/**', '.github/workflows/console.yml']
  pull_request:
    paths: ['console/**', '.github/workflows/console.yml']
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Record exact revision and runtime
        run: |
          git rev-parse HEAD
          node --version
          npm --version
      - name: Release-check display model
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
