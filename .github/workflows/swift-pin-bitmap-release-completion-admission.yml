name: Bitmap Release-only completion admission
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Previously unrun Release on unchanged candidate with corrected terminal evidence parser
        required: true
        type: choice
        options:
          - pin-bitmap-release-completion-v1
permissions:
  contents: read
concurrency:
  group: swift-pin-bitmap-release-completion-admission
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /vm/
            /verification/swift-pin-bitmap-match-binding-correction/
            /verification/swift-pin-bitmap-match-actual-review/
            /verification/swift-pin-bitmap-match-host-admission/
            /verification/swift-pin-bitmap-terminal-parser-correction/
            /verification/swift-pin-bitmap-release-completion-admission/
            /verification/swift-pin-bitmap-lint-host-evidence-correction/admit.py
            /verification/swift-pin-bitmap-format-lint-host-correction/admit.py
            /verification/swift-pin-bitmap-format-lint-host-correction/bounded_commands.py
      - name: Guarded source and mocked host controls
        timeout-minutes: 2
        run: |
          python3 -B verification/swift-pin-bitmap-release-completion-admission/host_controls.py
          python3 -B verification/swift-pin-bitmap-release-completion-admission/controls.py
      - name: Install exact pinned Rust tool identities
        timeout-minutes: 2
        env:
          RUSTUP_HOME: ${{ runner.temp }}/swift-pin-bitmap-release-completion-v1-toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Three bounded Release completion children
        timeout-minutes: 14
        env:
          RUSTUP_HOME: ${{ runner.temp }}/swift-pin-bitmap-release-completion-v1-toolchain
          MIXER_PIN_BITMAP_RELEASE_SELECTION: ${{ inputs.profile }}
        run: python3 -B verification/swift-pin-bitmap-release-completion-admission/admit.py run
      - name: Retain Release output, historical attribution, identities and custody
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: swift-pin-bitmap-release-completion-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pin-bitmap-release-completion-v1-evidence/
            !${{ runner.temp }}/pin-bitmap-release-completion-v1-evidence/scratch/
            verification/swift-pin-bitmap-release-completion-admission/host-controls-result.json
            verification/swift-pin-bitmap-release-completion-admission/controls-result.json
          if-no-files-found: error
          retention-days: 30
