name: Phoenix foundation checks
on:
  push:
    paths:
      - 'hosted/**'
      - 'verification/identity-network-current-source-v5/**'
      - 'verification/identity-network-current-source-v6/**'
      - 'verification/identity-network-current-source-v7/**'
      - 'verification/identity-network-current-source-v8/**'
      - 'verification/identity-network-current-source-v9/**'
      - 'verification/identity-network-current-source-v10/**'
      - 'verification/identity-network-current-source-v11/selection.json'
      - 'verification/identity-network-current-source-v11/selected-source-manifest.json'
      - 'verification/identity-network-current-source-v12/selection.json'
      - 'verification/identity-network-current-source-v12/selected-source-manifest.json'
      - 'verification/identity-network-current-source-v13/selection.json'
      - 'verification/identity-network-current-source-v13/selected-source-manifest.json'
      - 'services/protocol/testdata/signed-release-v3.json'
      - 'services/protocol/testdata/release-v3-cases.json'
      - '.github/workflows/hosted.yml'
      - 'console/src/api/**'
      - 'console/src/domain/workspace-directory.ts'
      - 'console/src/domain/build-overview.ts'
      - 'console/src/domain/build-read.ts'
      - 'console/src/domain/build-catalog.ts'
      - 'console/tests/cookie-build-client.test.mjs'
      - 'console/tsconfig.json'
      - 'console/src/api/browser-session-client.ts'
      - 'console/src/state/browser-session-controller.ts'
      - 'console/src/state/workspace-controller.ts'
      - 'console/package.json'
      - 'console/package-lock.json'
      - 'verification/hosted-customer-workspace-http-integration/node-client-driver.mjs'
      - 'verification/hosted-browser-auth-protocol/run.py'
  pull_request:
    paths:
      - 'hosted/**'
      - 'verification/identity-network-current-source-v5/**'
      - 'verification/identity-network-current-source-v6/**'
      - 'verification/identity-network-current-source-v7/**'
      - 'verification/identity-network-current-source-v8/**'
      - 'verification/identity-network-current-source-v9/**'
      - 'verification/identity-network-current-source-v10/**'
      - 'verification/identity-network-current-source-v11/selection.json'
      - 'verification/identity-network-current-source-v11/selected-source-manifest.json'
      - 'verification/identity-network-current-source-v12/selection.json'
      - 'verification/identity-network-current-source-v12/selected-source-manifest.json'
      - 'verification/identity-network-current-source-v13/selection.json'
      - 'verification/identity-network-current-source-v13/selected-source-manifest.json'
      - 'services/protocol/testdata/signed-release-v3.json'
      - 'services/protocol/testdata/release-v3-cases.json'
      - '.github/workflows/hosted.yml'
      - 'console/src/api/**'
      - 'console/src/domain/workspace-directory.ts'
      - 'console/src/domain/build-overview.ts'
      - 'console/src/domain/build-read.ts'
      - 'console/src/domain/build-catalog.ts'
      - 'console/tests/cookie-build-client.test.mjs'
      - 'console/tsconfig.json'
      - 'console/src/api/browser-session-client.ts'
      - 'console/src/state/browser-session-controller.ts'
      - 'console/src/state/workspace-controller.ts'
      - 'console/package.json'
      - 'console/package-lock.json'
      - 'verification/hosted-customer-workspace-http-integration/node-client-driver.mjs'
      - 'verification/hosted-browser-auth-protocol/run.py'
permissions:
  contents: read
jobs:
  phoenix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /hosted/
            /AGENTS.md
            /THIRD_PARTY.yml
            /docs/hosted-browser-auth-protocol.md
            /docs/hosted-browser-session-storage.md
            /services/protocol/testdata/signed-release-v3.json
            /services/protocol/testdata/release-v3-cases.json
            /console/package.json
            /console/tsconfig.json
            /console/tests/cookie-build-client.test.mjs
            /console/src/api/cookie-build-client.ts
            /console/src/domain/build-read.ts
            /console/src/domain/build-overview.ts
            /console/package-lock.json
            /console/src/api/workspace-client.ts
            /console/src/api/workspace-transport.ts
            /console/src/domain/workspace-directory.ts
            /console/src/api/browser-session-client.ts
            /console/src/api/cookie-workspace-client.ts
            /console/src/state/browser-session-controller.ts
            /console/src/state/workspace-controller.ts
            /console/src/api/cookie-build-catalog-client.ts
            /console/src/domain/build-catalog.ts
            /verification/identity-network-current-source-v4/selection.json
            /verification/identity-network-current-source-v4/selected-source-manifest.json
            /verification/identity-network-current-source-v5/selection.json
            /verification/identity-network-current-source-v5/selected-source-manifest.json
            /verification/identity-network-current-source-v6/selection.json
            /verification/identity-network-current-source-v6/selected-source-manifest.json
            /verification/identity-network-current-source-v7/selection.json
            /verification/identity-network-current-source-v7/selected-source-manifest.json
            /verification/identity-network-current-source-v8/selection.json
            /verification/identity-network-current-source-v8/selected-source-manifest.json
            /verification/identity-network-current-source-v9/selection.json
            /verification/identity-network-current-source-v9/selected-source-manifest.json
            /verification/identity-network-current-source-v10/selection.json
            /verification/identity-network-current-source-v10/selected-source-manifest.json
            /verification/identity-network-current-source-v11/selection.json
            /verification/identity-network-current-source-v11/selected-source-manifest.json
            /verification/identity-network-current-source-v12/selection.json
            /verification/identity-network-current-source-v12/selected-source-manifest.json
            /verification/identity-network-current-source-v13/selection.json
            /verification/identity-network-current-source-v13/selected-source-manifest.json
            /verification/hosted-browser-auth-protocol/run.py
            /verification/hosted-customer-workspace-http-integration/node-client-driver.mjs
            /verification/hosted-customer-artifact-event/golden_event.hex
            /verification/hosted-customer-artifact-event/golden_hashes.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          version-file: hosted/.tool-versions
          version-type: strict
      - name: Provision PostgreSQL 17 for disposable host checks
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y noble
          sudo apt-get install --yes --no-install-recommends postgresql-17 postgresql-client-17
          for tool in postgres initdb pg_ctl psql createdb; do
            version=$("/usr/lib/postgresql/17/bin/$tool" --version)
            printf '%s\n' "$version"
            [[ "$version" == "$tool (PostgreSQL) 17."* ]]
          done
      - name: Resolve locked dependencies
        working-directory: hosted
        run: mix deps.get --check-locked
      - name: Browser auth protocol host checks
        working-directory: hosted
        env:
          MIX_ENV: test
        run: |
          mix deps.compile jason
          python3 ../verification/hosted-browser-auth-protocol/run.py
      - name: Compile workspace client for real HTTP integration
        working-directory: console
        run: |
          node --version
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/typescript/bin/tsc --version
          node node_modules/typescript/bin/tsc src/api/workspace-client.ts src/api/browser-session-client.ts src/state/browser-session-controller.ts src/api/cookie-build-client.ts \
            --target ES2022 --module ES2022 --moduleResolution bundler \
            --strict --skipLibCheck --lib ES2022,DOM \
            --outDir "$RUNNER_TEMP/workspace-client"
          cp ../verification/hosted-customer-workspace-http-integration/node-client-driver.mjs \
            "$RUNNER_TEMP/workspace-client/driver.mjs"
          cp ../hosted/test/support/browser_read_client.mjs "$RUNNER_TEMP/workspace-client/browser-read-driver.mjs"
          cp ../hosted/test/support/browser_build_client.mjs "$RUNNER_TEMP/workspace-client/browser-build-driver.mjs"
          cp ../hosted/test/support/browser_build_catalog_client.mjs "$RUNNER_TEMP/workspace-client/browser-build-catalog-driver.mjs"
          printf 'MIXER_BROWSER_CATALOG_NODE_DRIVER=%s/browser-build-catalog-driver.mjs\n' "$RUNNER_TEMP/workspace-client" >> "$GITHUB_ENV"
          printf 'MIXER_BROWSER_BUILD_NODE_DRIVER=%s/browser-build-driver.mjs\n' "$RUNNER_TEMP/workspace-client" >> "$GITHUB_ENV"
          printf 'MIXER_BROWSER_READ_NODE_DRIVER=%s/browser-read-driver.mjs\n' "$RUNNER_TEMP/workspace-client" >> "$GITHUB_ENV"
          printf '%s\n' '{"type":"module"}' > "$RUNNER_TEMP/workspace-client/package.json"
          printf 'MIXER_WORKSPACE_HTTP_NODE_DRIVER=%s/driver.mjs\n' "$RUNNER_TEMP/workspace-client" >> "$GITHUB_ENV"
      - name: Browser session storage and migration checks
        working-directory: hosted
        env:
          MIX_ENV: test
        run: |
          mix deps.compile
          python3 test/mixer_hosted/browser_auth/run_storage_fixture.py \
            --pg-bin /usr/lib/postgresql/17/bin
          python3 test/mixer_hosted/browser_auth/run_migration_fixture.py \
            --pg-bin /usr/lib/postgresql/17/bin \
            --output "$RUNNER_TEMP/browser-migrations"
      - name: Phoenix and disposable PostgreSQL host checks
        working-directory: hosted
        run: |
          shasum -a 256 config/runtime.exs lib/mixer_hosted_web/browser_http.ex lib/mixer_hosted_web/browser_login_http.ex lib/mixer_hosted_web/endpoint.ex lib/mixer_hosted/application.ex lib/mixer_hosted/browser_auth/installation.ex lib/mixer_hosted/browser_auth/supervisor.ex test/foundation_integration_test.exs test/mixer_hosted/browser_auth/ordinary_console_catalog_navigation_cookie_pg_join_test.exs test/mixer_hosted/browser_auth/private_login_http_test.exs test/mixer_hosted/identity/startup_config_test.exs test/mixer_hosted/identity/startup_lifecycle_test.exs test/runtime_config_test.exs test/support/browser_login_provider_fixture.ex test/support/identity_startup_fixture.ex test/support/ordinary_browser_startup_fixture.ex
          mix format config/runtime.exs lib/mixer_hosted_web/browser_http.ex lib/mixer_hosted_web/browser_login_http.ex lib/mixer_hosted_web/endpoint.ex lib/mixer_hosted/application.ex lib/mixer_hosted/browser_auth/installation.ex lib/mixer_hosted/browser_auth/supervisor.ex test/foundation_integration_test.exs test/mixer_hosted/browser_auth/ordinary_console_catalog_navigation_cookie_pg_join_test.exs test/mixer_hosted/browser_auth/private_login_http_test.exs test/mixer_hosted/identity/startup_config_test.exs test/mixer_hosted/identity/startup_lifecycle_test.exs test/runtime_config_test.exs test/support/browser_login_provider_fixture.ex test/support/identity_startup_fixture.ex test/support/ordinary_browser_startup_fixture.ex
          shasum -a 256 config/runtime.exs lib/mixer_hosted_web/browser_http.ex lib/mixer_hosted_web/browser_login_http.ex lib/mixer_hosted_web/endpoint.ex lib/mixer_hosted/application.ex lib/mixer_hosted/browser_auth/installation.ex lib/mixer_hosted/browser_auth/supervisor.ex test/foundation_integration_test.exs test/mixer_hosted/browser_auth/ordinary_console_catalog_navigation_cookie_pg_join_test.exs test/mixer_hosted/browser_auth/private_login_http_test.exs test/mixer_hosted/identity/startup_config_test.exs test/mixer_hosted/identity/startup_lifecycle_test.exs test/runtime_config_test.exs test/support/browser_login_provider_fixture.ex test/support/identity_startup_fixture.ex test/support/ordinary_browser_startup_fixture.ex
          python3 scripts/test-local.py \
            --pg-bin /usr/lib/postgresql/17/bin \
            --output "$RUNNER_TEMP/phoenix-foundation" \
            --additional-test diagnostics/browser_login_trace_test.exs
      - name: Preserve host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-foundation-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/phoenix-foundation/
            verification/hosted-browser-auth-protocol/attempts/
            verification/hosted-browser-session-storage/attempts/
            ${{ runner.temp }}/browser-migrations/
