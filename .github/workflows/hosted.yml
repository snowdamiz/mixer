      - name: Admit the explicitly selected current hosted source
        run: python3 -B hosted/scripts/test-identity-network.py --check-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          version-file: hosted/.tool-versions
          version-type: strict
      - name: Provision PostgreSQL 17 for disposable host checks
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y noble
          sudo apt-get install --yes --no-install-recommends postgresql-17 postgresql-client-17
          for tool in postgres initdb pg_ctl psql createdb; do
            version=$("/usr/lib/postgresql/17/bin/$tool" --version)
            printf '%s\n' "$version"
            [[ "$version" == "$tool (PostgreSQL) 17."* ]]
          done
      - name: Check native artifact worker protocol with fixture processes
        run: |
          python3 -B hosted/scripts/test_native_artifact_worker.py
          python3 -B -O hosted/scripts/test_native_artifact_worker.py
          for optimization in '' -O; do
            for suite in test_linux_android_runner_server test_linux_android_docker_adapter test_linux_android_runner_cli test_linux_android_artifact_importer; do
              python3 -B ${optimization:+-O} "hosted/scripts/$suite.py"
            done
            python3 -B ${optimization:+-O} tests/integration/managed-android-local-linux-pair25/test_managed_layout.py
          done
      - name: Resolve locked dependencies
        working-directory: hosted
        run: mix deps.get --check-locked
      - name: Check frozen ordinary browser graph format
        working-directory: hosted
        run: |
          mix format --check-formatted \
            config/runtime.exs \
            lib/mixer_hosted/application.ex \
            lib/mixer_hosted/browser_auth/installation.ex \
            lib/mixer_hosted/browser_auth/store.ex \
            lib/mixer_hosted/browser_auth/supervisor.ex \
            lib/mixer_hosted/identity/key_owner_supervisor.ex \
            lib/mixer_hosted_web/browser_http.ex \
            lib/mixer_hosted_web/browser_login_http.ex \
            lib/mixer_hosted_web/endpoint.ex \
            test/foundation_integration_test.exs \
            test/mixer_hosted/browser_auth/initial_admit_queue_test.exs \
            test/mixer_hosted/browser_auth/ordinary_console_catalog_navigation_cookie_pg_join_test.exs \
            test/mixer_hosted/browser_auth/private_login_http_test.exs \
            test/mixer_hosted/browser_auth/storage_fixture.exs \
            test/mixer_hosted/identity/key_owner_supervisor_fixture_test.exs \
            test/mixer_hosted/identity/startup_config_test.exs \
            test/mixer_hosted/identity/startup_lifecycle_test.exs \
            test/runtime_config_test.exs \
            test/support/browser_login_provider_fixture.ex \
            test/support/browser_storage_fixture.ex \
            test/support/identity_startup_fixture.ex \
            test/support/initial_admit_queue_fixture.ex \
            test/support/ordinary_browser_startup_fixture.ex
      - name: Browser auth protocol host checks
        working-directory: hosted
        env:
          MIX_ENV: test
        run: |
          mix deps.compile jason
          python3 ../verification/hosted-browser-auth-protocol/run.py
      - name: Provider trust constructor production-mode checks
        run: >-
          elixir --erl '+S 2:2 +SDcpu 1 +SDio 1 +sbwt none'
          hosted/scripts/check-provider-trust-config.exs hosted/deps/jason/lib
      - name: Startup secret constructor production-mode checks
        run: >-
          elixir --erl '+S 2:2 +SDcpu 1 +SDio 1 +sbwt none'
          hosted/scripts/check-startup-secrets.exs hosted/deps/jason/lib
      - name: Compile locked dependencies for composition controls
        working-directory: hosted
        env:
          MIX_ENV: prod
        run: mix deps.compile hpax mint jose
      - name: Run isolated configured startup composition controls with fake leaves
        run: >-
          elixir --erl '+S 2:2 +SDcpu 1 +SDio 1 +sbwt none'
          -pa hosted/_build/prod/lib/hpax/ebin
          -pa hosted/_build/prod/lib/mint/ebin
          -pa hosted/_build/prod/lib/jose/ebin
          hosted/scripts/check-configured-startup.exs hosted/deps/jason/lib
      - name: Compile workspace client for real HTTP integration
        working-directory: console
        run: |
          node --version
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/typescript/bin/tsc --version
          node --test tests/workspace-binding.test.mjs
          node node_modules/typescript/bin/tsc src/api/workspace-client.ts src/api/browser-session-client.ts src/state/browser-session-controller.ts src/api/cookie-build-client.ts \
            --target ES2022 --module ES2022 --moduleResolution bundler \
            --strict --skipLibCheck --lib ES2022,DOM \
            --outDir "$RUNNER_TEMP/workspace-client"
          cp ../verification/hosted-customer-workspace-http-integration/node-client-driver.mjs \
            "$RUNNER_TEMP/workspace-client/driver.mjs"
          cp ../hosted/test/support/browser_read_client.mjs "$RUNNER_TEMP/workspace-client/browser-read-driver.mjs"
          cp ../hosted/test/support/browser_build_client.mjs "$RUNNER_TEMP/workspace-client/browser-build-driver.mjs"
          cp ../hosted/test/support/browser_build_catalog_client.mjs "$RUNNER_TEMP/workspace-client/browser-build-catalog-driver.mjs"
          printf 'MIXER_BROWSER_CATALOG_NODE_DRIVER=%s/browser-build-catalog-driver.mjs\n' "$RUNNER_TEMP/workspace-client" >> "$GITHUB_ENV"
          printf 'MIXER_BROWSER_BUILD_NODE_DRIVER=%s/browser-build-driver.mjs\n' "$RUNNER_TEMP/workspace-client" >> "$GITHUB_ENV"
          printf 'MIXER_BROWSER_READ_NODE_DRIVER=%s/browser-read-driver.mjs\n' "$RUNNER_TEMP/workspace-client" >> "$GITHUB_ENV"
          printf '%s\n' '{"type":"module"}' > "$RUNNER_TEMP/workspace-client/package.json"
          printf 'MIXER_WORKSPACE_HTTP_NODE_DRIVER=%s/driver.mjs\n' "$RUNNER_TEMP/workspace-client" >> "$GITHUB_ENV"
      - name: Browser session storage and migration checks
        working-directory: hosted
        env:
          MIX_ENV: test
        run: |
          mix deps.compile
          python3 test/mixer_hosted/browser_auth/run_storage_fixture.py \
            --pg-bin /usr/lib/postgresql/17/bin
          python3 test/mixer_hosted/browser_auth/run_migration_fixture.py \
            --pg-bin /usr/lib/postgresql/17/bin \
            --output "$RUNNER_TEMP/browser-migrations"
      - name: Phoenix and disposable PostgreSQL host checks
        working-directory: hosted
        run: |
          python3 scripts/test-local.py \
            --pg-bin /usr/lib/postgresql/17/bin \
            --output "$RUNNER_TEMP/phoenix-foundation" \
            --test-timeout 600 \
            --additional-test diagnostics/browser_login_trace_test.exs
      - name: Preserve host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-foundation-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/phoenix-foundation/
            verification/hosted-browser-auth-protocol/attempts/
            verification/hosted-browser-session-storage/attempts/
            ${{ runner.temp }}/browser-migrations/
