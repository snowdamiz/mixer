name: Owned engine checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # runner-images macos-15-arm64/20260907.0337 includes this installation;
      # its default Xcode 16.4 supplies Swift 6.1 and cannot build the CLI.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
    steps:
      - uses: actions/checkout@v4
        with:
          # Builder boundary fixtures read the independently reviewed native pin.
          fetch-depth: 0
      - name: Verify and record pinned Apple toolchain
        run: |
          python3 scripts/ci/verify-apple-toolchain.py \
            --developer-dir "$DEVELOPER_DIR" \
            --xcode-version 26.3 --xcode-build 17C529 \
            --output "$RUNNER_TEMP/apple-toolchain.json"
      - name: CI selection regression tests
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Policy and acceptance integrity
        run: python3 scripts/check-policy.py
      - name: Generated capability schema and host lifecycle
        run: |
          python3 capabilities/tools/generate.py --check
          swift test --package-path capabilities
      - name: Guest transport raw byte corpus
        run: |
          python3 capabilities/tools/check-guest-transport-fixtures.py --configuration debug
          python3 capabilities/tools/check-guest-transport-fixtures.py --configuration release
      - name: Native HTTP, deadlines and exit ownership under Thread Sanitizer
        run: |
          swift test --package-path capabilities \
            --scratch-path "$RUNNER_TEMP/capability-tsan" --sanitize thread \
            --filter 'NativeCapabilityExitTests|NativeHTTPTransportTests|CapabilityHostDeadlineTests|CapabilityCarriedDeadlineTests'
      - name: Swift SDK, update verifier and CLI
        run: |
          swift --version
          python3 scripts/ci/check-sdk-package.py
          swift test
          swift test --package-path updates
          swift test --package-path cli
          python3 -B -m unittest discover -s cli/build-tests -v
          swift test --package-path native/android/engine
          python3 runtime-identity/tools/vectors.py --check
          python3 runtime-identity/tools/vectors_v2.py --check
          swift test --package-path runtime-identity
          python3 -B -m unittest discover -s runtime-identity/build-tools/tests -v
      - name: Statically linked owned VM and signed startup
        run: |
          python3 -m unittest discover -s runtime/build-tests -v
          python3 runtime/build-vm.py --revision "$GITHUB_SHA" --target host --output "$RUNNER_TEMP/native-vm"
          swift test --package-path runtime -Xlinker "-L$RUNNER_TEMP/native-vm/lib"
          swift test --package-path activation -Xlinker "-L$RUNNER_TEMP/native-vm/lib"
          swift test --package-path verification/runtime-review -Xlinker "-L$RUNNER_TEMP/native-vm/lib"
      - name: Isolated experimental capability archive and shared registry
        run: |
          rustup component add llvm-tools
          python3 experimental-capability-runtime/build-tests/test_builder.py
          python3 -O experimental-capability-runtime/build-tests/test_builder.py
          python3 experimental-capability-runtime/build-vm.py \
            --revision "$GITHUB_SHA" --target host --output "$RUNNER_TEMP/capability-vm"
          cat "$RUNNER_TEMP/capability-vm/receipt.json"
          capability_clang="$(xcrun --sdk macosx --find clang)"
          capability_sdk="$(xcrun --sdk macosx --show-sdk-path)"
          "$capability_clang" -isysroot "$capability_sdk" -std=c11 -Wall -Wextra -Werror -mmacosx-version-min=14.0 \
            -I"$RUNNER_TEMP/capability-vm/include" \
            "$RUNNER_TEMP/capability-vm/source/vm/tests/capability_ffi_smoke.c" \
            "$RUNNER_TEMP/capability-vm/lib/libmixer_vm_capability_experimental.a" \
            -lpthread -ldl -lm -o "$RUNNER_TEMP/capability-vm-smoke"
          "$RUNNER_TEMP/capability-vm-smoke"
          "$capability_clang" -isysroot "$capability_sdk" -std=c11 -Wall -Wextra -Werror -mmacosx-version-min=14.0 \
            -I"$RUNNER_TEMP/capability-vm/include" \
            experimental-capability-runtime/build-tests/mixed_registry.c \
            "$RUNNER_TEMP/capability-vm/lib/libmixer_vm_capability_experimental.a" \
            -lpthread -ldl -lm -o "$RUNNER_TEMP/capability-vm-registry"
          "$RUNNER_TEMP/capability-vm-registry"
          "$capability_clang" -isysroot "$capability_sdk" -std=c11 -Wall -Wextra -Werror -mmacosx-version-min=14.0 \
            -I"$RUNNER_TEMP/capability-vm/include" \
            experimental-capability-runtime/build-tests/guest_ui.c \
            "$RUNNER_TEMP/capability-vm/lib/libmixer_vm_capability_experimental.a" \
            -lpthread -ldl -lm -o "$RUNNER_TEMP/capability-vm-guest-ui"
          "$RUNNER_TEMP/capability-vm-guest-ui"
      - name: Experimental guest-to-native bridge and public consumer
        run: |
          for mode in debug release tsan; do
            bridge_flags=()
            if [[ "$mode" == release ]]; then bridge_flags=(-c release); fi
            if [[ "$mode" == tsan ]]; then bridge_flags=(--sanitize thread); fi
            python3 -B experimental-capability-runtime/verification/with-loopback.py \
              --output "$RUNNER_TEMP/bridge-$mode-tls" -- \
              swift test --package-path experimental-capability-runtime \
              --scratch-path "$RUNNER_TEMP/bridge-$mode" "${bridge_flags[@]}" \
              -Xcc "-I$RUNNER_TEMP/capability-vm/include" \
              -Xlinker "-L$RUNNER_TEMP/capability-vm/lib" \
              -Xswiftc -warnings-as-errors -Xswiftc -DMIXER_EXPERIMENTAL_LOCAL_TLS_TEST
          done
          swift test --package-path verification/capability-bridge-review \
            --scratch-path "$RUNNER_TEMP/bridge-public" \
            -Xcc "-I$RUNNER_TEMP/capability-vm/include" \
            -Xlinker "-L$RUNNER_TEMP/capability-vm/lib" -Xswiftc -warnings-as-errors
      - name: Installed capability material and exact native preimage
        run: |
          python3 -B verification/capability-installed-material/test_native_preimage.py -v
          swift test --package-path capability-activation \
            --scratch-path "$RUNNER_TEMP/capability-material" \
            -Xcc "-I$RUNNER_TEMP/capability-vm/include" \
            -Xlinker "-L$RUNNER_TEMP/capability-vm/lib" -Xswiftc -warnings-as-errors
      - name: Generated consumer integration
        run: |
          swift run --package-path cli mixer create VerificationApp --directory "$RUNNER_TEMP/VerificationApp"
          swift run --package-path cli mixer test --directory "$RUNNER_TEMP/VerificationApp"
          swift run --package-path cli mixer build --platform ios --directory "$RUNNER_TEMP/VerificationApp"
  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record owned VM host tools
        run: |
          git rev-parse HEAD
          uname -a
          rustc --version --verbose
          cargo --version --verbose
          node --version
      - name: Owned VM debug tests
        run: cargo test --locked --manifest-path vm/Cargo.toml
      - name: Owned VM release tests
        run: cargo test --locked --release --manifest-path vm/Cargo.toml
      - name: Experimental validation, cached execution, WASI, native sessions and explicit reference checks
        run: |
          python3 vm/tools/generate-capability-terminals.py
          cargo test --locked --manifest-path vm/Cargo.toml --features experimental-stream-validation,experimental-function-cache,experimental-span-execution,experimental-swift-wasi,experimental-swift-reactor,experimental-capability-native
          cargo test --locked --release --manifest-path vm/Cargo.toml --features experimental-stream-validation,experimental-function-cache,experimental-span-execution,experimental-swift-wasi,experimental-swift-reactor,experimental-capability-native
          cargo test --locked --manifest-path vm/Cargo.toml --features experimental-stream-validation,experimental-function-cache,experimental-span-execution,experimental-swift-wasi,experimental-swift-reactor,experimental-capability-native -- --ignored
          cargo test --locked --release --manifest-path vm/Cargo.toml --features experimental-stream-validation,experimental-function-cache,experimental-span-execution,experimental-swift-wasi,experimental-swift-reactor,experimental-capability-native -- --ignored
      - name: Allocation observer isolation under background noise
        env:
          MIXER_ALLOCATOR_NOISE: '1'
        run: |
          cargo test --locked --manifest-path vm/Cargo.toml --features experimental-span-execution,experimental-capability-native --test span_function_cache_allocations --test span_execution_allocations --test experimental_allocations --test experimental_capability_guest_allocations --test capability_ffi_allocations -- --nocapture
          cargo test --locked --manifest-path vm/Cargo.toml --features experimental-span-execution,experimental-capability-native --test span_function_cache_allocations --test span_execution_allocations --test experimental_allocations --test experimental_capability_guest_allocations --test capability_ffi_allocations --release -- --nocapture
      # Host callback/Looper simulations only; physical Android stays pending.
      # NDK headers are provided by the GitHub-hosted Android toolchain image.
      - name: Android facade and UI-entry transport host regressions
        run: |
          : "${ANDROID_NDK_HOME:?An official Android NDK is required}"
          python3 scripts/ci/check-android-transport.py \
            --cc cc --ndk "$ANDROID_NDK_HOME" \
            --output "$RUNNER_TEMP/android-facade-transport"
      - name: Public native capability C client
        run: |
          cargo build --locked --release --lib --manifest-path vm/Cargo.toml --features experimental-capability-native
          cc -std=c11 -O2 -Wall -Wextra -Werror -Ivm/include \
            vm/tests/capability_ffi_smoke.c vm/target/release/libmixer_vm.a \
            -ldl -lpthread -lm -o "$RUNNER_TEMP/capability-native-smoke"
          "$RUNNER_TEMP/capability-native-smoke"
          cc -std=c11 -O2 -Wall -Wextra -Werror -Ivm/include \
            experimental-capability-runtime/build-tests/guest_ui.c vm/target/release/libmixer_vm.a \
            -ldl -lpthread -lm -o "$RUNNER_TEMP/capability-native-guest-ui"
          "$RUNNER_TEMP/capability-native-guest-ui"
          python3 verification/capability-native-review/make-fixtures.py "$RUNNER_TEMP/capability-native-fixtures"
          cc -std=c11 -O2 -Wall -Wextra -Werror -Ivm/include \
            verification/capability-native-review/public_client.c vm/target/release/libmixer_vm.a \
            -pthread -ldl -lm -o "$RUNNER_TEMP/capability-native-review"
          "$RUNNER_TEMP/capability-native-review" \
            "$RUNNER_TEMP/capability-native-fixtures/capability.wasm" \
            "$RUNNER_TEMP/capability-native-fixtures/legacy.wasm"
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - name: Record service host tools
        run: |
          git rev-parse HEAD
          uname -a
          go version
          go env GOTOOLCHAIN GOROOT
      - name: Protocol, recovery and API race tests
        working-directory: services
        run: |
          go mod verify
          go vet ./...
          go test -race ./...
