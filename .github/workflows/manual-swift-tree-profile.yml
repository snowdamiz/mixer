name: Manual Swift distribution tree profile
on:
  workflow_dispatch:
    inputs:
      profile_admission:
        description: "Exact original image, or explicitly admit one scoped current macos26/X64/Python3.14 diagnostic"
        required: true
        type: choice
        default: exact-original-image
        options:
          - exact-original-image
          - same-class-current-image
permissions:
  contents: read
jobs:
  swift-tree-profile:
    runs-on: macos-26-intel
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/manual-swift-tree-profile.yml
            /scripts/ci/diagnostics/
            /cli/Sources/MixerBuild/Resources/android-build.py
            /verification/plan-continuation-2026-11-07/generated-java-ci-integration/bootstrap.py
      - name: One admitted Swift tree profile
        shell: bash
        env:
          PROFILE_ADMISSION: ${{ inputs.profile_admission }}
        run: |
          set -euo pipefail
          python3 -I -B -S scripts/ci/diagnostics/swift-tree-profile.py launch \
            --admission "$PROFILE_ADMISSION" \
            --output "$RUNNER_TEMP/swift-tree-profile-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Preserve selected diagnostic evidence even on failure
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: swift-tree-profile-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/swift-tree-profile-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/swift-tree-profile-${{ github.run_id }}-${{ github.run_attempt }}/outer/commands.json
            ${{ runner.temp }}/swift-tree-profile-${{ github.run_id }}-${{ github.run_attempt }}/outer/HOLD.json
            ${{ runner.temp }}/swift-tree-profile-${{ github.run_id }}-${{ github.run_attempt }}/outer/*.stdout
            ${{ runner.temp }}/swift-tree-profile-${{ github.run_id }}-${{ github.run_attempt }}/outer/*.stderr
            ${{ runner.temp }}/swift-tree-profile-${{ github.run_id }}-${{ github.run_attempt }}/inner/commands.json
            ${{ runner.temp }}/swift-tree-profile-${{ github.run_id }}-${{ github.run_attempt }}/inner/HOLD.json
            ${{ runner.temp }}/swift-tree-profile-${{ github.run_id }}-${{ github.run_attempt }}/inner/*.stdout
            ${{ runner.temp }}/swift-tree-profile-${{ github.run_id }}-${{ github.run_attempt }}/inner/*.stderr
            ${{ runner.temp }}/swift-tree-profile-${{ github.run_id }}-${{ github.run_attempt }}/profile/*.json
            ${{ runner.temp }}/swift-tree-profile-${{ github.run_id }}-${{ github.run_attempt }}/profile/profile.pstats
            ${{ runner.temp }}/swift-tree-profile-${{ github.run_id }}-${{ github.run_attempt }}/profile/instrumented-owner.py
