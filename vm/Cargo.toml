[package]
name = "mixer-vm"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Mixer"
description = "Independently authored bounded integer WebAssembly interpreter"

[features]
default = []
experimental-stream-validation = []
experimental-function-cache = ["experimental-stream-validation"]
experimental-span-execution = ["experimental-function-cache"]
experimental-swift-wasi = []
experimental-swift-reactor = ["experimental-stream-validation", "experimental-swift-wasi"]
experimental-capability-mailbox = []
experimental-capability-guest = ["experimental-capability-mailbox"]
experimental-capability-native = ["experimental-capability-guest"]

[lib]
name = "mixer_vm"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "mixer-vm"
path = "src/main.rs"

[profile.release]
overflow-checks = true
panic = "unwind"
